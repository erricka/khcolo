# Local or single-server deployment: PostgreSQL + FastAPI + Next.js.
#   cp .env.example .env   # then fill in the secrets
#   docker compose up --build
# The site is published on :3000. Put a TLS-terminating reverse proxy in front of
# it in production (see docs/deployment.md). The API and database stay private.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-khcolo}
      POSTGRES_USER: ${POSTGRES_USER:-khcolo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-khcolo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-khcolo}
      ENVIRONMENT: production
      # Only the web container talks to the API, so its X-Forwarded-For is trusted.
      TRUST_PROXY_HEADERS: "true"
      FRONTEND_REVALIDATE_URL: http://web:3000/api/revalidate/
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        SITE_ENV: ${SITE_ENV:-development}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://khcolo.com}
        ENFORCE_HTTPS: ${ENFORCE_HTTPS:-false}
    restart: unless-stopped
    environment:
      KHCOLO_API_URL: http://api:8000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET in .env}
      SITE_ENV: ${SITE_ENV:-development}
      CANONICAL_HOST: ${CANONICAL_HOST:-}
      ENFORCE_HTTPS: ${ENFORCE_HTTPS:-false}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
